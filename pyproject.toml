[project]
name = "logunusual"
version = "0.1.0"
description = "Fast lognormal galaxy mock generator (JAX + numpy) for SPHEREx per-bin mocks"
authors = [{ name = "James Cheshire", email = "cheshire@caltech.edu" }]
requires-python = ">=3.12"
# Runtime deps are managed by pixi (conda) + the `setup` task (pip); see below.
dependencies = []

[project.scripts]
logunusual = "logunusual.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logunusual"]

# JAX is pip-installed (not conda) so the CPU and CUDA variants can share one conda
# solve; the pin follows the validated disco-mocks / ichnaea stack (jax/jaxlib 0.10.1).
# Run `pixi run setup` once after `pixi install`.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
scipy = "*"
pyarrow = ">=17"
healpy = "*"
h5py = "*"
pyyaml = "*"
matplotlib = "*"
pip = "*"
black = "*"
flake8 = "*"
pytest = "*"

[tool.pixi.tasks.setup]
description = "CPU: pip-install pinned JAX + editable-install this pkg"
# Guarded so it cannot quietly put CPU JAX into the `gpu` prefix. The
# `test ... && <body>` chain is what makes the guard ABORT rather than merely
# complain: deno_task_shell (which runs pixi tasks) has no if/then/fi and no
# { ...; } grouping, and a `|| (echo; exit 1)` subshell prints the error and then
# runs the body anyway. Same construction as disco-mocks / ichnaea.
cmd = """
test "$PIXI_ENVIRONMENT_NAME" != "gpu" || echo "ERROR: 'setup' installs CPU JAX; in the gpu env run 'pixi run -e gpu setup-gpu' instead." >&2
test "$PIXI_ENVIRONMENT_NAME" != "gpu" && pip install jax==0.10.1 jaxlib==0.10.1 \
  && pip install -e . --no-deps
"""
env = { JAX_ENABLE_X64 = "1" }

[tool.pixi.tasks.setup-gpu]
description = "CUDA variant of `setup`: jax[cuda12] + this pkg. MUST be run as `pixi run -e gpu setup-gpu`."
# The env alone makes the right thing possible, not enforced: `pixi run setup-gpu`
# without `-e gpu` would still pip-install jax[cuda12] into `default` and recreate
# the exact footgun the gpu env exists to close.
cmd = """
test "$PIXI_ENVIRONMENT_NAME" = "gpu" || echo "ERROR: run as 'pixi run -e gpu setup-gpu'. Without -e gpu this installs jax[cuda12] into the '$PIXI_ENVIRONMENT_NAME' env, whose CPU workflows would then start grabbing a GPU." >&2
test "$PIXI_ENVIRONMENT_NAME" = "gpu" && pip install 'jax[cuda12]==0.10.1' \
  && pip install -e . --no-deps
"""
env = { JAX_ENABLE_X64 = "1" }

# The `gpu` environment exists so `setup-gpu` has somewhere to install that is NOT
# the CPU `default` env. Both take the same conda dependencies -- JAX is
# pip-installed, so CPU vs CUDA is decided entirely by which setup task runs into
# which prefix. BOTH envs declare one solve-group so conda resolves them TOGETHER
# (a solve-group only binds environments that DECLARE it).
[tool.pixi.environments]
default = { features = [], solve-group = "all" }
gpu = { features = [], solve-group = "all" }
# Input P(k) tables only (`scripts/make_pk_tables.py`); no JAX, no package install.
tables = { features = ["tables"], no-default-feature = true }

# The exact conda-forge CAMB build the v28 tables were made with; conda-forge has no
# 1.5.9 for linux-aarch64, so the env is osx-arm64 only.
[tool.pixi.feature.tables]
platforms = ["osx-arm64"]

[tool.pixi.feature.tables.dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
camb = { version = "==1.5.9", build = "py312h904ef0c_0" }

[tool.pixi.feature.tables.tasks.pk-tables]
cmd = "python scripts/make_pk_tables.py"

[tool.pixi.tasks.test]
cmd = "pytest -q"
env = { JAX_ENABLE_X64 = "1" }

[tool.pytest.ini_options]
# `slow` is opt-out, not opt-in: the full suite is the merge gate and must run
# every gate. `pytest -m "not slow"` is the fast loop while developing.
markers = ["slow: multi-second statistical gates (seed counts measured, not picked)"]

[tool.pixi.tasks.check-format]
cmd = "black --check --target-version py312 --skip-string-normalization logunusual scripts tests"

[tool.pixi.tasks.format]
cmd = "black --target-version py312 --skip-string-normalization logunusual scripts tests"

[tool.pixi.tasks.lint]
cmd = "flake8 --max-line-length=88 --extend-ignore=E203 logunusual scripts tests"
