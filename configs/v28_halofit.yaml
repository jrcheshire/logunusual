# logunusual run config: the seven v28 bins with a Takahashi-halofit galaxy target
# (ROADMAP M4). Paths are placeholders. Each bin names two tables in pk_dir, both from
# `pixi run -e tables pk-tables make --model {linear,halofit}`: `pk_file` (linear: the
# matter field, the velocities and f_NL's M(k)) and `pk_galaxy_file` (halofit: the
# galaxy target b^2 P only). Every other bin field is the v28 default, grids included:
# halofit is attainable on them (finer grids are not, see ROADMAP M4), and a run with
# a galaxy table raises on any clipped P_G mode. Bin 7 keeps the linear galaxy target:
# its 5 fundamental modes clip with either table (realized 1.109x the linear target
# there), so with a galaxy table it would raise; halofit is 1.06x linear at its
# Nyquist.
run_name: v28_halofit
output_dir: runs            # <output_dir>/<run_name>/realization_NNNNN/catalog.parq
pk_dir: data                # holds one P(k) TSV per bin, named by the bin's pk_file
mask:                       # omit (or null) for the full sky
  path: data/mask.h5        # HEALPix 0/1 map, root attrs PIXTYPE=HEALPIX, ORDERING
  dataset: MASK
seed_base: 137000000        # seed = seed_base + realization * 1000 + bin index
nbar_scale: 1.0             # multiplies every bin's nbar (smoke runs)
grid_scale: 1.0             # multiplies every bin's N_grid (smoke runs)
radial_buffer: 160.0        # Mpc/h drawn beyond the shell on both sides
jitter_p: 1                 # uniform-in-cell placement (the validated construction)
n_workers: null             # sampler threads, one x-slab per task (null: core count)
angular_precut: true        # draw only cells whose galaxies can land in the mask
row_group_rows: 1048576     # parquet row-group pin (2^20)
n_radial_bins: 8            # sub-shells of the density-profile diagnostic
f_nl: 0.0                   # local f_NL (LSS convention); 0 = Gaussian
fnl_p: 1.0                  # p in b(k) = b + 2 (b - p) f_NL delta_c / M(k)
# primordial:                # the P(k) tables' normalisation, for M(k); defaults:
#   A_s: 2.1e-9
#   n_s: 0.9649
#   k_pivot: 0.0742280285   # h/Mpc (0.05 / Mpc)
#   omega_m: 0.3153
